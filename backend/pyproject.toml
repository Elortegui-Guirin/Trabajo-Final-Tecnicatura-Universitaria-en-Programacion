# GeoForraje Backend - pyproject.toml
[tool.poetry]
name = "geoforraje-backend"
version = "0.1.0"
description = "GeoForraje 1.0 Backend API"
authors = ["GeoForraje Team"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.110"
uvicorn = {extras = ["standard"], version = "^0.29"}
sqlmodel = "^0.0.14"
asyncpg = "^0.29"
alembic = "^1.13"
psycopg2-binary = "^2.9"
python-jose = {extras = ["cryptography"], version = "^3.3"}
passlib = {extras = ["bcrypt"], version = "^1.7"}
pydantic = "^2.7"
pydantic-settings = "^2.3"
python-multipart = "^0.0.9"
email-validator = "^2.1"
geoalchemy2 = "^0.14"
shapely = "^2.0"
pyproj = "^3.6"
rasterio = "^1.3"
numpy = "^1.26"
prometheus-fastapi-instrumentator = "^7.0"
httpx = "^0.27"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2"
pytest-asyncio = "^0.23"
pytest-cov = "^5.0"
ruff = "^0.4"
mypy = "^1.10"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py311"
line-length = 100
select = ["E", "F", "I", "W", "UP", "B", "C4", "SIM", "T20"]
ignore = ["E501", "B008"]
exclude = [".venv", "alembic", "migrations"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true